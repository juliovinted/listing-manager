<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Listing Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f5f7;color:#111}
header{padding:22px 18px 12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #ddd}
h1{font-size:28px;margin:0 0 4px}p{color:#666;margin:0}.wrap{padding:16px;max-width:700px;margin:auto}
button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;font-weight:600;background:#111;color:#fff}
.secondary{background:#e9e9ed;color:#111}.danger{background:#ff3b30}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 1px 4px #00000012}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#777;font-size:14px}.tag{display:inline-block;background:#eee;border-radius:9px;padding:5px 8px;font-size:12px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
input,select{width:100%;padding:12px;border:1px solid #d5d5d8;border-radius:12px;background:#fff;margin:6px 0 12px}
label{font-size:13px;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none}.range{width:100%}.preview{width:100%;max-height:55vh;object-fit:contain;background:#eee;border-radius:15px}
.nav{display:flex;gap:8px;margin-bottom:14px}.nav button{flex:1}.empty{text-align:center;padding:40px 10px;color:#777}
.small{font-size:12px}.check{display:flex;gap:8px;align-items:center;margin:8px 0 14px}.check input{width:auto;margin:0}
</style>
</head>
<body>
<header><h1>Listing Manager</h1><p>Gestor privado de tus anuncios</p></header>
<div class="wrap">
<div class="nav">
<button onclick="show('home')">Anuncios</button>
<button onclick="newListing()">+ Nuevo</button>
</div>

<section id="home"></section>

<section id="editor" class="hidden">
<div class="card">
<h2 id="editorTitle">Nuevo anuncio</h2>
<label>Nombre / título</label><input id="name" placeholder="Nike sudadera vintage">
<label>Marca</label><input id="brand" placeholder="Nike">
<label>Talla</label><input id="size" placeholder="M">
<label>Precio (€)</label><input id="price" type="number" step="0.01" placeholder="25">
<label>Cuenta</label>
<select id="account"><option>Mi cuenta</option><option>Cuenta hermana</option><option>Cuenta primo</option></select>
<label>Estado</label>
<select id="condition"><option>Nuevo</option><option>Muy bueno</option><option>Bueno</option></select>
<label>Descripción</label><input id="description" placeholder="Descripción del artículo">
<label>Fotos</label>
<input id="photos" type="file" accept="image/*" multiple capture="environment">
<div id="photoGrid" class="grid"></div>
<div class="actions">
<button onclick="saveListing()">Guardar anuncio</button>
<button class="secondary" onclick="show('home')">Cancelar</button>
</div>
</div>
</section>

<section id="privacy" class="hidden">
<div class="card">
<h2>Privacidad / edición de fotos</h2>
<p class="muted">Crea copias procesadas de las fotos y guárdalas en el dispositivo.</p>
<div id="privacyGrid" class="grid"></div>
<hr style="border:0;border-top:1px solid #eee;margin:18px 0">
<label>Rotación: <span id="rotVal">0°</span></label>
<input class="range" id="rotation" type="range" min="-5" max="5" step="0.1" value="0" oninput="rotVal.textContent=this.value+'°'">
<label>Recorte por borde: <span id="cropVal">0 px</span></label>
<input class="range" id="crop" type="range" min="0" max="10" step="1" value="0" oninput="cropVal.textContent=this.value+' px'">
<label class="check"><input id="strip" type="checkbox" checked> Eliminar metadatos EXIF al exportar</label>
<div class="actions">
<button onclick="processPhotos()">Procesar y guardar en Fotos</button>
<button class="secondary" onclick="show('home')">Volver</button>
</div>
<p class="small" style="margin-top:12px">La exportación genera nuevas imágenes JPG sin los metadatos EXIF habituales.</p>
</div>
</section>
</div>

<script>
let listings=JSON.parse(localStorage.getItem('lm_listings')||'[]');
let current=null, files=[];

function show(id){
  ['home','editor','privacy'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  if(id==='home') renderHome();
}
function newListing(){
 current={id:Date.now(),photos:[]}; files=[]; clearForm(); show('editor');
}
function clearForm(){
 ['name','brand','size','price','description'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('account').value='Mi cuenta';document.getElementById('condition').value='Nuevo';
 document.getElementById('photoGrid').innerHTML='';
}
function renderHome(){
 const el=document.getElementById('home');
 if(!listings.length){el.innerHTML='<div class="card empty">Todavía no tienes anuncios.<br><br>Pulsa <b>+ Nuevo</b> para crear el primero.</div>';return}
 el.innerHTML=listings.map((l,i)=>`<div class="card">
 <div class="row"><div><b>${esc(l.name||'Sin título')}</b><div class="muted">${esc(l.brand||'')} · ${esc(l.size||'')}</div></div><b>${Number(l.price||0).toFixed(2)} €</b></div>
 <span class="tag">${esc(l.account)}</span> <span class="tag">${esc(l.condition)}</span>
 ${l.photos.length?'<div class="grid">'+l.photos.map(p=>`<img src="${p}">`).join('')+'</div>':''}
 <div class="actions"><button onclick="editListing(${i})">Editar</button><button class="secondary" onclick="openPrivacy(${i})">🔒 Privacidad / fotos</button><button class="danger" onclick="deleteListing(${i})">Borrar</button></div>
 </div>`).join('');
}
function editListing(i){
 current=listings[i]; files=[]; document.getElementById('name').value=current.name||'';document.getElementById('brand').value=current.brand||'';document.getElementById('size').value=current.size||'';document.getElementById('price').value=current.price||'';document.getElementById('description').value=current.description||'';document.getElementById('account').value=current.account||'Mi cuenta';document.getElementById('condition').value=current.condition||'Nuevo';renderPhotoGrid(current.photos);show('editor');
}
function saveListing(){
 current.name=name.value;current.brand=brand.value;current.size=size.value;current.price=price.value;current.description=description.value;current.account=account.value;current.condition=condition.value;
 const idx=listings.findIndex(x=>x.id===current.id); if(idx>=0) listings[idx]=current; else listings.push(current);
 localStorage.setItem('lm_listings',JSON.stringify(listings));show('home');
}
photos.addEventListener('change', async e=>{
 for(const f of e.target.files){current.photos.push(await fileToDataURL(f))}
 renderPhotoGrid(current.photos);
});
function renderPhotoGrid(arr){photoGrid.innerHTML=arr.map(p=>`<img src="${p}">`).join('')}
function openPrivacy(i){current=listings[i];document.getElementById('privacyGrid').innerHTML=current.photos.map(p=>`<img src="${p}">`).join('');show('privacy')}
function processPhotos(){
 if(!current.photos.length){alert('Este anuncio no tiene fotos.');return}
 const rot=+rotation.value,crop=+crop.value;
 Promise.all(current.photos.map(src=>processImage(src,rot,crop))).then(out=>{
   const a=document.createElement('a'); // fallback: download individually through generated links
   out.forEach((blob,i)=>{const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`listing_${current.id}_${i+1}.jpg`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)});
   alert('Fotos procesadas. En Safari, confirma las descargas y guárdalas en Fotos/Archivos según la opción que aparezca.');
 });
}
function processImage(src,deg,crop){
 return new Promise(resolve=>{
  const img=new Image();img.onload=()=>{
   const rad=deg*Math.PI/180, s=Math.abs(Math.sin(rad)),c=Math.abs(Math.cos(rad));
   const nw=Math.ceil(img.width*c+img.height*s),nh=Math.ceil(img.width*s+img.height*c);
   const canvas=document.createElement('canvas');canvas.width=Math.max(1,nw-2*crop);canvas.height=Math.max(1,nh-2*crop);
   const ctx=canvas.getContext('2d');ctx.translate(nw/2,nh/2);ctx.rotate(rad);ctx.drawImage(img,-img.width/2,-img.height/2);
   const data=ctx.getImageData(crop,crop,canvas.width,canvas.height);canvas.width=data.width;canvas.height=data.height;ctx.putImageData(data,0,0);
   canvas.toBlob(resolve,'image/jpeg',0.95);
  };img.src=src;
 });
}
function deleteListing(i){if(confirm('¿Borrar este anuncio?')){listings.splice(i,1);localStorage.setItem('lm_listings',JSON.stringify(listings));renderHome()}}
function fileToDataURL(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
show('home');
</script>
</body>
</html>
